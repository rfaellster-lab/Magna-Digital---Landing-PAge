<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MagnaWeb | A Elite do Posicionamento Digital</title>
    <meta name="description" content="Criação de Landing Pages de Alto Padrão com Domínio Incluso por R$ 249,90." />

    <!-- External Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Image Comparison Slider Support -->
    <script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css" />

    <!-- Tailwind Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#FBF5E6',
                            200: '#F2E2B8',
                            300: '#E6C875',
                            400: '#D4AF37', // Base Gold
                            500: '#C5A028',
                            600: '#A08018',
                            700: '#755C0F',
                            900: '#423205',
                        },
                        obsidian: '#020202',
                        charcoal: '#0A0A0A',
                        tech: {
                            dark: '#050505',
                            panel: '#0F0F0F',
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'gold-shine': 'linear-gradient(135deg, #A08018 0%, #F2E2B8 50%, #A08018 100%)',
                        'tech-grid': 'linear-gradient(to right, #ffffff03 1px, transparent 1px), linear-gradient(to bottom, #ffffff03 1px, transparent 1px)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'pulse-gold': 'pulse-gold 3s infinite',
                        'shimmer': 'shimmer 3s infinite',
                        'scroll': 'scroll 2s ease-in-out infinite',
                        'fadeIn': 'fadeIn 0.5s ease-out',
                        'scaleUp': 'scaleUp 0.3s ease-out',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        'pulse-gold': {
                            '0%': { boxShadow: '0 0 0 0 rgba(212, 175, 55, 0.2)' },
                            '70%': { boxShadow: '0 0 0 10px rgba(212, 175, 55, 0)' },
                            '100%': { boxShadow: '0 0 0 0 rgba(212, 175, 55, 0)' },
                        },
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' },
                        },
                        scroll: {
                            '0%': { transform: 'translateY(0)', opacity: 1 },
                            '100%': { transform: 'translateY(10px)', opacity: 0 },
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        },
                        scaleUp: {
                            '0%': { transform: 'scale(0.95)' },
                            '100%': { transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020202;
            color: #e2e8f0;
            overflow-x: hidden;
            font-feature-settings: "cv11", "ss01";
            -webkit-font-smoothing: antialiased;
        }

        /* Selection Style */
        ::selection {
            background-color: #D4AF37;
            color: #000;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020202;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D4AF37;
        }

        /* Premium Glassmorphism */
        .glass-panel {
            background: rgba(5, 5, 5, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-card {
            background: rgba(15, 15, 15, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .glass-card:hover {
            background: rgba(20, 20, 20, 0.8);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        /* Text Gradients */
        .text-gold-gradient {
            background: linear-gradient(to bottom right, #F2E2B8, #D4AF37, #A08018);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Cinematic Grain (Noise) */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.035;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            mix-blend-mode: overlay;
        }

        /* Tech Background Grid */
        .bg-tech-grid {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        /* Slider Customization */
        img-comparison-slider {
            --divider-width: 1px;
            --divider-color: #D4AF37;
            --default-handle-opacity: 1;
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            outline: none;
        }
        
        /* Floating Button Animation */
        .magnetic-btn {
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "gsap": "https://aistudiocdn.com/gsap@^3.13.0",
    "gsap/": "https://aistudiocdn.com/gsap@^3.13.0/"
  }
}
</script>
</head>
  <body>
    <div class="noise-overlay"></div>
    <div id="root"></div>
    <!-- Entry point pointing to /index.tsx for correct resolution on Vercel -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
